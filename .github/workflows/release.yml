name: Build/release

# Inherited from the original project. It does not fit this fork (it fails on the old
# packages / uses Node 10), so it only runs when started by hand from the Actions tab.
# The automatic checks are checks.yml and windows-build.yml.
on: workflow_dispatch

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v1
        
      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v1
        with:
          node-version: 10
      
      - name: Build/release Electron app
        uses: samuelmeuli/action-electron-builder@v1.3.0
        with:
          package_root: './app'
          github_token: ${{ secrets.github_token }}
          release: ${{ startsWith(github.ref, 'refs/tags/v') }}




