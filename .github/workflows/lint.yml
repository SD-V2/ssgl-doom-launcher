name: Audit/lint
# Inherited from the original project. It does not fit this fork (it fails on the old
# packages / uses Node 10), so it only runs when started by hand from the Actions tab.
# The automatic checks are checks.yml and windows-build.yml.
on: workflow_dispatch
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@master
      
    - name: Install
      run: yarn install
      working-directory: './app'
      
    - name: Audit
      run: yarn audit --groups dependencies
      working-directory: './app'
      
    - name: Lint
      run: yarn lint
      working-directory: './app'
        
